<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>지도</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<style>
html,body,#map{margin:0;height:100%}
#panel{position:absolute;top:8px;left:8px;z-index:2;box-sizing:border-box;width:min(320px,calc(100% - 16px));max-height:calc(100% - 16px);overflow:auto;background:#fff;color:#1d2939;border-radius:8px;padding:10px 12px;font:14px/1.45 system-ui,sans-serif;box-shadow:0 1px 6px rgba(0,0,0,.3)}
#panel button{display:block;width:100%;text-align:left;margin:4px 0;padding:8px;border:1px solid #98a2b3;border-radius:6px;background:#fff;color:inherit;font:inherit;cursor:pointer}
#panel button[aria-pressed="true"]{border-color:#1849a9;background:#e8f0fe}
#panel button:focus-visible{outline:3px solid #1849a9;outline-offset:1px}
#info{margin:8px 0 0;font-size:13px}
.legend{margin:8px 0 0;padding:0;list-style:none;font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.note{margin:8px 0 0;font-size:11px;color:#475467}
#panel summary{font-weight:700;font-size:15px;cursor:pointer;padding:2px 0}
#panel summary:focus-visible{outline:3px solid #1849a9;outline-offset:1px}
/* 좁은 화면: 패널을 아래쪽 시트로 두고 높이를 제한해 지도를 가리지 않게 한다 */
@media (max-width:600px){#panel{top:auto;bottom:8px;max-height:46%}}
</style>
</head>
<body>
<div id="map"></div>
<section id="panel" aria-label="해운대 시범 코스">
  <details id="coursebox" open>
    <summary>해운대 시범 코스</summary>
    <div id="list" role="group" aria-label="코스 목록">불러오는 중…</div>
  </details>
  <p id="info" role="status" aria-live="polite"></p>
  <ul class="legend">
    <li><i style="background:#d92d20"></i>신호등 있는 횡단보도(부산시 공공데이터)</li>
    <li><i style="background:#f79009"></i>OSM 신호 횡단(참고)</li>
    <li><i style="background:#667085"></i>OSM 무신호·미분류 횡단(참고)</li>
    <li><i style="background:#fff;border:2px solid #101828;box-sizing:border-box"></i>코스 출입구(누르면 가장 가까운 횡단까지 거리)</li>
  </ul>
  <p class="note">신호 없는 횡단보도는 공공 파일에 없습니다. 지도 확대(15단계 이상)하면 코스 밖 신호 횡단보도도 표시됩니다.<br>© OpenStreetMap contributors (ODbL), 부산광역시 교통정보서비스센터</p>
</section>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script>
// 타일 스타일 주소. 타일 서버를 바꿀 때 여기만 수정한다.
const STYLE_URL = 'https://tiles.openfreemap.org/styles/positron';
// 대한민국 대략 범위 [서, 남, 동, 북] (독도·제주·마라도 포함, 행정경계 아님). 시작 화면은 부울경.
const BOUNDS = [[124.0, 32.8], [132.2, 38.8]];
const KIND_LABEL = { trail: '산책로', riverside: '강변길', road_proxy: '차도 기준 근사' };
const OSM_KIND_LABEL = { signal: '신호', signal_junction: '교차로 신호기', uncontrolled: '무신호', marked: '표시 횡단', unmarked: '표시 없음', unknown: '미분류' };

// 이름 라벨을 한글(name:ko, 없으면 현지 name)만 쓰도록 바꾼다. 번호판 라벨(ref)은 그대로 둔다.
function koreanOnly(style) {
  const ko = ['coalesce', ['get', 'name:ko'], ['get', 'name']];
  for (const layer of style.layers) {
    const tf = layer.layout && layer.layout['text-field'];
    if (tf && JSON.stringify(tf).includes('name')) layer.layout['text-field'] = ko;
  }
  return style;
}

const EMPTY = { type: 'FeatureCollection', features: [] };
const $ = (id) => document.getElementById(id);

fetch(STYLE_URL).then(r => r.json()).then(style => {
  window.map = new maplibregl.Map({
    container: 'map',
    style: koreanOnly(style),
    center: [129.03, 35.12],
    zoom: 11,
    maxBounds: BOUNDS,
  });
  window.map.on('load', initCourses);
});

async function getJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ' ' + r.status);
  return r.json();
}

function initCourses() {
  const map = window.map;
  map.addSource('xwalk', { type: 'geojson', data: EMPTY });
  map.addSource('course', { type: 'geojson', data: EMPTY });
  map.addLayer({ id: 'xwalk', type: 'circle', source: 'xwalk', minzoom: 15,
    paint: { 'circle-radius': 4, 'circle-color': '#d92d20', 'circle-opacity': 0.55, 'circle-stroke-color': '#fff', 'circle-stroke-width': 1 } });
  map.addLayer({ id: 'course-line', type: 'line', source: 'course', filter: ['==', ['get', 'layer'], 'course'],
    layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#1849a9', 'line-width': 4 } });
  map.addLayer({ id: 'course-osm', type: 'circle', source: 'course', filter: ['==', ['get', 'layer'], 'osm'],
    paint: { 'circle-radius': 5, 'circle-stroke-color': '#fff', 'circle-stroke-width': 1.5,
      'circle-color': ['match', ['get', 'kind'], 'signal', '#f79009', 'signal_junction', '#f79009', '#667085'] } });
  map.addLayer({ id: 'course-entrance', type: 'circle', source: 'course', filter: ['==', ['get', 'layer'], 'entrance'],
    paint: { 'circle-radius': 7, 'circle-color': '#ffffff', 'circle-stroke-color': '#101828', 'circle-stroke-width': 2.5 } });
  map.addLayer({ id: 'course-signal', type: 'circle', source: 'course', filter: ['==', ['get', 'layer'], 'signal'],
    paint: { 'circle-radius': 6, 'circle-color': '#d92d20', 'circle-stroke-color': '#fff', 'circle-stroke-width': 2 } });

  map.on('click', 'course-entrance', (e) => {
    const p = e.features[0].properties;
    const km = (v) => (v === null || v === 'null' ? '정보 없음' : v + 'm');
    new maplibregl.Popup().setLngLat(e.lngLat)
      .setText('출입구 ' + p.seq + ' · 가장 가까운 공공 신호 횡단보도 ' + km(p.nearestSignalM) + ' · OSM 횡단 ' + km(p.nearestOsmM) + (p.nearestOsmKind && p.nearestOsmKind !== 'null' ? '(' + (OSM_KIND_LABEL[p.nearestOsmKind] || p.nearestOsmKind) + ')' : '')).addTo(map);
  });
  for (const id of ['xwalk', 'course-osm', 'course-signal']) {
    map.on('click', id, (e) => {
      const p = e.features[0].properties;
      const label = (p.label && p.label !== 'null' ? p.label : '이름 없음') + (p.kind ? ' · ' + (OSM_KIND_LABEL[p.kind] || p.kind) : '') + (p.dong && p.dong !== 'null' ? ' · ' + p.dong : '');
      new maplibregl.Popup().setLngLat(e.lngLat).setText(label).addTo(map);
    });
    map.on('mouseenter', id, () => { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', id, () => { map.getCanvas().style.cursor = ''; });
  }
  map.on('moveend', loadCrosswalks);

  getJson('/api/courses').then(({ courses }) => renderList(courses))
    .catch(() => { $('list').textContent = '코스 데이터를 불러오지 못했습니다.'; });
}

let xwalkTimer;
function loadCrosswalks() {
  const map = window.map;
  clearTimeout(xwalkTimer);
  if (map.getZoom() < 15) { map.getSource('xwalk').setData(EMPTY); return; }
  xwalkTimer = setTimeout(() => {
    const c = map.getCenter(), b = map.getBounds();
    const half = (v, lim) => Math.min(v, lim);
    const w = Math.max(b.getWest(), c.lng - half(c.lng - b.getWest(), 0.024));
    const e = Math.min(b.getEast(), c.lng + half(b.getEast() - c.lng, 0.024));
    const s = Math.max(b.getSouth(), c.lat - half(c.lat - b.getSouth(), 0.024));
    const n = Math.min(b.getNorth(), c.lat + half(b.getNorth() - c.lat, 0.024));
    getJson('/api/crosswalks?bbox=' + [w, s, e, n].map((v) => v.toFixed(5)).join(','))
      .then((fc) => map.getSource('xwalk').setData(fc)).catch(() => {});
  }, 250);
}

function renderList(courses) {
  const list = $('list');
  list.textContent = '';
  for (const c of courses) {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-pressed', 'false');
    b.textContent = c.name + ' (' + (KIND_LABEL[c.kind] || c.kind) + ', ' + (c.length_m / 1000).toFixed(1) + 'km)';
    b.addEventListener('click', () => selectCourse(c, b));
    list.appendChild(b);
  }
}

async function selectCourse(c, button) {
  for (const b of $('list').children) b.setAttribute('aria-pressed', String(b === button));
  const info = $('info');
  info.textContent = '불러오는 중…';
  try {
    const fc = await getJson('/api/courses/' + encodeURIComponent(c.code) + '/geojson');
    const map = window.map;
    map.getSource('course').setData(fc);
    const bounds = new maplibregl.LngLatBounds();
    for (const f of fc.features) {
      const coords = f.geometry.type === 'LineString' ? f.geometry.coordinates : [f.geometry.coordinates];
      for (const p of coords) bounds.extend(p);
    }
    if (window.innerWidth <= 600) $('coursebox').open = false; // 좁은 화면에서는 목록을 접어 지도를 보여 준다
    if (!bounds.isEmpty()) map.fitBounds(bounds, { padding: 60, maxZoom: 17 });
    const osm = c.crossings.filter((x) => x.source === 'osm').map((x) => (OSM_KIND_LABEL[x.kind] || x.kind) + ' ' + x.count).join(', ');
    info.textContent = '공공 데이터의 신호 횡단보도 ' + c.unique_crossings + '곳(' + c.buffer_m + 'm 이내, 12m 이내는 한 곳으로 합산)'
      + (osm ? ' · OSM 횡단 참고: ' + osm : '') + '. ' + (c.note || '');
  } catch (err) {
    info.textContent = '코스를 불러오지 못했습니다.';
  }
}
</script>
</body>
</html>
